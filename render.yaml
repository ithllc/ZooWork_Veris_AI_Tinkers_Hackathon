projects:
  - name: revampai
    environments:
      - name: production
        services:
          - type: web
            name: revampai
            runtime: node
            repo: https://github.com/ithllc/ZooWork_Veris_AI_Tinkers_Hackathon
            branch: main
            plan: free
            region: virginia
            autoDeployTrigger: 'off'
            buildCommand: npm ci --omit=dev
            startCommand: npm start
            healthCheckPath: /api/health
            envVars:
              - key: NODE_ENV
                value: production
              - key: NODE_VERSION
                value: '22'
              - key: PUBLIC_URL
                value: https://revampai-3ms5.onrender.com
              - key: ZOOWORK_API_KEY
                sync: false
              - key: ZOODATA_API_KEY
                sync: false
              - key: ACCESS_TOKEN_SECRET
                generateValue: true
              - key: DEMO_DAILY_LIMIT
                value: '30'
              - key: DATABASE_URL
                fromDatabase:
                  name: revampai-accounts
                  property: connectionString
              - key: VAPID_PUBLIC_KEY
                sync: false
              - key: VAPID_PRIVATE_KEY
                sync: false
        databases:
          - name: revampai-accounts
            plan: free
            region: virginia
            postgresMajorVersion: '17'
            ipAllowList: []
